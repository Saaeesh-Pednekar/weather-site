version: '3.8'

services:
  django-backend:
    build:
      context: ./back-end  # Looks inside the back-end folder for its Dockerfile
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./back-end:/app    # Maps local backend code changes instantly
    ports:
      - "8000:8000"
    environment:
      - DEBUG=1
    networks:
      - weather-net

  nginx-frontend:
    build:
      context: ./front-end # Looks inside the front-end folder for its Dockerfile
      
    volumes:
      - ./front-end:/usr/share/nginx/html 
    ports:
      - "80:80"            # Opens your website on http://localhost
    networks:
      - weather-net

networks:
  weather-net:
    driver: bridge
